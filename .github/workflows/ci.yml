name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check src tests scripts
      - name: Compile
        run: uv run python -m compileall -q src scripts
      - name: Config sanity
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from campusguide.config import (
              load_abstention_config,
              load_graph_config,
              load_handoff_config,
              load_mcp_config,
              load_retrieval_config,
          )
          from campusguide.flows.calendar import load_calendar
          from campusguide.flows.dsl import load_flows

          root = Path.cwd()
          load_retrieval_config(root / "configs" / "retrieval.yaml")
          load_abstention_config(root / "configs" / "abstention.yaml")
          load_graph_config(root / "configs" / "graph.yaml")
          load_handoff_config(root / "configs" / "handoff.yaml")
          load_mcp_config(root / "configs" / "mcp.yaml")
          events = load_calendar(root / "configs" / "calendar.yaml")
          flows = load_flows(
              root / "configs" / "flows",
              calendar_event_ids={event.event_id for event in events},
          )
          print(f"configs ok: {len(events)} events, {len(flows)} flows")
          PY
      - name: Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Test
        run: uv run pytest
