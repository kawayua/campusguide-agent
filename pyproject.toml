[project]
name = "campusguide"
version = "0.1.0"
description = "面向高校公开制度文档的条款级问答与办事指引 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yaukin" }]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "lxml>=5.3.0",
    "pydantic>=2.9.2",
    "pymupdf>=1.24.11",
    "PyYAML>=6.0.2",
    "qdrant-client>=1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
]
w2 = [
    "torch>=2.6",
    "sentence-transformers>=3.0",
    "gradio>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campusguide"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that require network access (not used in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 flag Chinese punctuation as "ambiguous"; this is a Chinese-language corpus.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["campusguide"]
