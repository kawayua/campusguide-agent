# W4 起使用；W1 只用 collection/vector 配置初始化 Qdrant 骨架。
collection: articles_v1
alias: articles_current
embedding_model: ${EMBEDDING_MODEL}
dense_vector_name: dense
dense_vector_size: 1024
sparse_vector_name: sparse
sparse_mode: bm25
bm25_k1: 1.2
bm25_b: 0.75
rrf_k: 60

recall_top_k: 30
# 先取 RRF top 20 做 rerank，再取 top 8；2026-10-24 与 top30 对比后启用。
rerank_candidates: 20
rerank_top_n: 8
reranker_model: ${RERANKER_MODEL}
token_budget: 4000
max_articles: 8

# 以下阈值用 20 题 dev_v0 校准（2026-10-24）：
# 可答题 top rerank 最低 0.725；非可答题最高 0.523；取 0.60 + 0.03 margin。
min_rerank_score: 0.60
min_score_margin: 0.03

# W2 dense-only 检索参数
query_top_k: 20
max_evidence: 8
max_chars_per_evidence: 800
min_dense_score: 0.55   # 2026-10-22 用 dev_v0 校准：可答题最低证据 0.598，非可答题最高 0.545
include_sections_default: false
