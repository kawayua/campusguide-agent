# 华南农业大学组织注册表
#
# 用途：
# 1. 给院级/专业级制度提供稳定的 college_id / major_id；
# 2. 校验 sources.yaml 中 issuer_college_id、audience_detail.colleges/majors；
# 3. 为将来的用户画像（学院、专业）提供同一套主键。
#
# 注意：
# - 不要用“工程学院”“计算机科学与技术”作为主键，只作为 name/aliases；
# - 学院合并、专业改名时不要复用 ID，补 aliases 和有效期；
# - 当前 W1 只收校级文件，这里先留空；首次收录院级文件时再填。
#
# 示例：
#
# colleges:
#   - college_id: engineering
#     name: 工程学院
#     aliases: [工学院]
#     valid_from: null
#     valid_to: null
#
# majors:
#   - major_id: computer-science
#     name: 计算机科学与技术
#     college_id: engineering
#     major_code: "080901"
#     aliases: [计算机, 计科]
#     valid_from: null
#     valid_to: null

schema_version: "1.0"
corpus_id: scau

# 数学与信息学院、软件学院下设数学系、计算机科学与工程系、信息工程系。
# 当前 organization 只登记学院与专业两级；系作为教师/专业页面的组织单位，
# 写入教师名单文档标题与 aliases，不单独占用主键。
colleges:
  - college_id: info
    name: 数学与信息学院、软件学院
    aliases: [数信学院, 数学与信息学院, 软件学院]
    valid_from: null
    valid_to: null
  - college_id: agri
    name: 农学院
    aliases: [华农农学院, 华南农业大学农学院]
    valid_from: null
    valid_to: null

majors:
  - major_id: math-applied
    name: 数学与应用数学
    college_id: info
    major_code: "070101"
    aliases: [数学, 应数]
    valid_from: null
    valid_to: null
  - major_id: info-computing
    name: 信息与计算科学
    college_id: info
    major_code: "070102"
    aliases: [信计, 信息与计算科学]
    valid_from: null
    valid_to: null
  - major_id: statistics
    name: 统计学
    college_id: info
    major_code: "071201"
    aliases: [统计]
    valid_from: null
    valid_to: null
  - major_id: data-science
    name: 数据科学与大数据技术
    college_id: info
    major_code: "080910T"
    aliases: [数据科学, 大数据技术, 数学科学与大数据技术]
    valid_from: null
    valid_to: null
  - major_id: computer-science
    name: 计算机科学与技术
    college_id: info
    major_code: "080901"
    aliases: [计算机, 计科, 计算机科学与技术]
    valid_from: null
    valid_to: null
  - major_id: software-engineering
    name: 软件工程
    college_id: info
    major_code: "080902"
    aliases: [软工, 软件工程]
    valid_from: null
    valid_to: null
  - major_id: information-management
    name: 信息管理与信息系统
    college_id: info
    major_code: "120102"
    aliases: [信管, 信息管理与信息系统]
    valid_from: null
    valid_to: null
  - major_id: big-data-management
    name: 大数据管理与应用
    college_id: info
    major_code: "120108T"
    aliases: [大数据管理, 大数据管理与应用]
    valid_from: null
    valid_to: null

  # 农学院：下设植物遗传育种系、作物信息与基因工程系、作物科学技术系、
  # 种子工程与技术系。系不单设主键，写入文档标题与 aliases。
  - major_id: agronomy
    name: 农学
    college_id: agri
    major_code: "090101"
    aliases: [农学, 农学丁颖, 丁颖创新班, 新农学]
    valid_from: null
    valid_to: null
  - major_id: seed-science
    name: 种子科学与工程
    college_id: agri
    major_code: "090105"
    aliases: [种子科学与工程, 种子]
    valid_from: null
    valid_to: null
  - major_id: bio-breeding
    name: 生物育种科学
    college_id: agri
    major_code: "090116TK"
    aliases: [生物育种科学, 生物育种]
    valid_from: null
    valid_to: null

# 研究生学科专业：与本科专业同名时用 level 区分（报告 A4 / 041）。
# 研究方向作为 aliases 登记，比较题的对象识别才能落到具体方向。
  - major_id: agricultural-engineering
    name: 农业工程
    college_id: agri
    major_code: "0828"
    level: graduate
    aliases: [农业工程]
    directions: [农业电气化与自动化, 农业机械化工程, 农业水土工程]
    valid_from: null
    valid_to: null
  - major_id: agricultural-engineering-info
    name: 农业工程与信息技术
    college_id: info
    major_code: "095136"
    level: graduate
    aliases: [农业工程与信息技术, 农业信息化, 农业工程与信息技术领域]
    valid_from: null
    valid_to: null
  - major_id: industrial-engineering-management
    name: 工业工程与管理
    college_id: info
    major_code: "125603"
    level: graduate
    aliases: [工业工程与管理, 工业工程, 工程管理]
    valid_from: null
    valid_to: null

# 班型：同一专业下的创新班、实验班、国际班等，培养方案不通用。
# level 与 major.level 一致；majors 引用上面的 major_id。
class_types:
  - class_id: dingying-innovation
    name: 丁颖创新班
    level: undergraduate
    majors: [agronomy]
    aliases: [丁颖班]
  - class_id: new-agronomy-innovation
    name: 新农学创新班
    level: undergraduate
    majors: [agronomy]
    aliases: [新农学本博班]
  - class_id: agronomy-general
    name: 农学普通班
    level: undergraduate
    majors: [agronomy]
    aliases: [农学普通班, 农学班, 普通农学]
  - class_id: info-innovation
    name: 信息类创新班
    level: undergraduate
    majors: [computer-science, software-engineering, data-science]
    aliases: [信息类实验班, 信息类卓越班]
