# 影子索引专用检索配置；不得用于生产服务。
# collection/alias 与 configs/retrieval.yaml 完全隔离，构建脚本会再次校验。
collection: articles_shadow_v1
alias: articles_shadow_current
embedding_model: ${EMBEDDING_MODEL}
dense_vector_name: dense
dense_vector_size: 1024
sparse_vector_name: sparse
sparse_mode: bm25
bm25_k1: 1.2
bm25_b: 0.75
rrf_k: 60

# 与生产召回参数保持一致，便于影子结果对比；不调整生产阈值。
recall_top_k: 50
rerank_candidates: 40
rerank_top_n: 12
reranker_model: ${RERANKER_MODEL}
token_budget: 8000
max_articles: 12
max_table_sections: 2

min_rerank_score: 0.60
min_score_margin: 0.0

query_top_k: 20
max_evidence: 8
max_chars_per_evidence: 2400
min_dense_score: 0.55
include_sections_default: false
