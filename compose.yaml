services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: campusguide-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    image: campusguide:local
    container_name: campusguide-app
    restart: unless-stopped
    init: true
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      HF_HOME: /app/hf_cache
      W8_REQUEST_TIMEOUT_SECONDS: "120"
    volumes:
      - ./data:/app/data
      - hf_cache:/app/hf_cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3).read(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 240s

volumes:
  hf_cache:
